spring.application.name=compass

# Local secrets live in backend/.env (see .env.example). Real env vars take precedence.
spring.config.import=optional:file:.env[.properties]

# Defaults point at a local `supabase start` stack.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:54322/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true

# Supabase Auth JWTs (asymmetric signing keys, published at the JWKS endpoint).
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_URL:http://127.0.0.1:54321}/auth/v1
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_URL:http://127.0.0.1:54321}/auth/v1/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256,RS256
spring.security.oauth2.resourceserver.jwt.audiences=authenticated

app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
